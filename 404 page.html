<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 Page - Bluestock</title>

  <!-- dotLottie player script -->
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
    }

    header {
      background: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.05);
    }

    .logo {
      font-weight: bold;
      color: #2c3e50;
      font-size: 20px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #007bff;
      font-size: 14px;
    }

    .container {
      padding: 60px 20px;
    }

    .oops {
      font-size: 48px;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 10px;
    }

    .animation-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .message {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .sub-message {
      color: #777;
      margin-bottom: 20px;
    }

    .error-code {
      color: #ff4d4f;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .btn {
      padding: 10px 25px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">BLUESTOCK</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Support</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="container">
    <div class="oops">OOPS...</div>

    <!-- 🔽 Centered Animation Below OOPS -->
    <div class="animation-wrapper">
      <dotlottie-player
        src="https://lottie.host/8ae641e3-60b9-4810-bca8-413aecacf742/Sig4CSZw1H.json"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px"
        direction="1"
        playMode="normal"
        loop
        autoplay>
      </dotlottie-player>
    </div>

    <div class="message">Something went wrong.</div>
    <div class="sub-message">Sorry, we can’t find the page you’re looking for.</div>
    <div class="error-code">Error Code 404</div>
    <button class="btn" onclick="history.back()">Go Back</button>
  </div>

</body>
</html>
